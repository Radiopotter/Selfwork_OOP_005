 
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webinar Aulab</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Il tuo CSS -->
    <link rel="stylesheet" href="Es.Webinaraulab.css">
  </head>

  <body style="font-family: 'Montserrat', sans-serif;">

    <main>

      <!-- HEADER CON BACKGROUND -->
      <header class="container-fluid py-4 header-custom">

        <div class="row justify-content-center text-center">

          <!-- LOGO -->
          <div class="col-12 mb-4">
            <img src="media progetto webina retrogaming/aulab-logo_y.png"
                 alt="Logo Aulab"
                 class="img-fluid"
                 style="max-width: 200px;">
          </div>

          <!-- TESTO -->
          <div class="col-12 col-md-8">
            <p>Webinar Gratuito</p>
            <h1>Metti le mani al codice divertendoti</h1>
            <p>Scopri come si sviluppa un videogame anni 2000</p>

            <!-- ICONA + DATA AFFIANCATE -->
            <div class="d-flex justify-content-center align-items-center my-4 gap-2">
              <i class="bi bi-calendar4-week h3 m-0"></i>
              <h3 class="m-0">25 Luglio 2023</h3>
            </div>

            <p>Ore 18:30</p>

            <button class="btn btn-primary btn-lg rounded-pill px-4 py-3 btn-custom">
              Iscriviti Gratuitamente
            </button>
          </div>

          <!-- IMMAGINE ARCADE -->
          <div class="col-12 col-md-6 mt-4">
            <img src="media progetto webina retrogaming/game arcade.png"
                 alt="Game arcade"
                 class="img-fluid">
          </div>

        </div>

      </header>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
